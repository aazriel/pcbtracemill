name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the installers to this existing release (e.g. v0.1.1); empty = only build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Allow Electron's sandbox (Ubuntu 24.04 restricts it)
        if: runner.os == 'Linux'
        run: |
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Build
        run: npm run build
      - name: Package
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pcbtracemill-${{ matrix.os }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.deb
          if-no-files-found: warn
      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(release/*/*.exe release/*/*.dmg release/*/*.AppImage release/*/*.deb)
          echo "Uploading ${files[*]} to $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber
